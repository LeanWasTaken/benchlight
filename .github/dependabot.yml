version: 2
updates:
  # The bun ecosystem reads bun.lock at the repo root.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 drops the JS compiler API (typescript/lib/tsc) that vue-tsc, vue-component-meta
      # and typescript-eslint load. Lift this once they support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # vue-tsc 3.3.14 reports false errors on plain const bindings in templates (Stress.vue).
      - dependency-name: vue-tsc
        versions: ['3.3.14']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
