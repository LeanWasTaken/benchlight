name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run fixtures

  browser:
    runs-on: ubuntu-latest
    # Same image as scripts/visual-linux.sh, so the committed *-linux.png baselines match.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bun@1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  git-install:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Route the benchlight repo through the read-only token
        env:
          BENCHLIGHT_TOKEN: ${{ secrets.BENCHLIGHT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${BENCHLIGHT_TOKEN}@github.com/LeanWasTaken/benchlight".insteadOf "ssh://git@github.com/LeanWasTaken/benchlight"
          git config --global --add url."https://x-access-token:${BENCHLIGHT_TOKEN}@github.com/LeanWasTaken/benchlight".insteadOf "git@github.com:LeanWasTaken/benchlight"
      - run: bun scripts/git-install-check.ts "git+ssh://git@github.com/LeanWasTaken/benchlight.git#${GITHUB_SHA}"
