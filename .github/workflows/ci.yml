name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run fixtures

  git-install:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Route the kdesign repo through the read-only token
        env:
          KDESIGN_TOKEN: ${{ secrets.KDESIGN_TOKEN }}
        run: git config --global url."https://x-access-token:${KDESIGN_TOKEN}@github.com/LeanWasTaken/kdesign".insteadOf "https://github.com/LeanWasTaken/kdesign"
      - run: bun scripts/git-install-check.ts "git+https://github.com/LeanWasTaken/kdesign.git#${GITHUB_SHA}"
